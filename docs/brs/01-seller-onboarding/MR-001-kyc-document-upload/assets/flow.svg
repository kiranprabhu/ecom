<svg viewBox="0 0 720 980" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12.5">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <polygon points="0,0 8,3.5 0,7" fill="#64748B"/>
    </marker>
    <marker id="arr-r" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <polygon points="0,0 8,3.5 0,7" fill="#DC2626"/>
    </marker>
    <marker id="arr-g" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <polygon points="0,0 8,3.5 0,7" fill="#16A34A"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="980" fill="#FAFAFA" rx="12"/>

  <!-- Title -->
  <text x="360" y="32" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">MR-001 — KYC Document Upload Flow</text>

  <!-- Legend -->
  <rect x="30" y="46" width="12" height="12" rx="2" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="46" y="57" fill="#475569" font-size="11">Seller Portal</text>
  <rect x="130" y="46" width="12" height="12" rx="2" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="146" y="57" fill="#475569" font-size="11">API / System</text>
  <rect x="240" y="46" width="12" height="12" rx="2" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5"/>
  <text x="256" y="57" fill="#475569" font-size="11">Admin Terminal</text>
  <rect x="370" y="46" width="12" height="12" rx="2" fill="#FEFCE8" stroke="#D97706" stroke-width="1.5"/>
  <text x="386" y="57" fill="#475569" font-size="11">Decision</text>
  <line x1="454" y1="52" x2="480" y2="52" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="485" y="57" fill="#475569" font-size="11">Error / reject loop</text>

  <!-- ── NODES ── -->

  <!-- START oval cy=85 -->
  <ellipse cx="360" cy="85" rx="118" ry="22" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
  <text x="360" y="89" text-anchor="middle" fill="#15803D" font-weight="600" font-size="13">Seller Account Created</text>

  <!-- ↓ -->
  <line x1="360" y1="107" x2="360" y2="131" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- BOX: View KYC Checklist cy=153 -->
  <rect x="230" y="133" width="260" height="40" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="360" y="150" text-anchor="middle" fill="#1E40AF" font-weight="500">View KYC Checklist</text>
  <text x="360" y="165" text-anchor="middle" fill="#3B82F6" font-size="11">Seller Portal</text>

  <!-- ↓ -->
  <line x1="360" y1="173" x2="360" y2="197" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- BOX: Upload Document cy=219 -->
  <rect x="230" y="199" width="260" height="40" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="360" y="216" text-anchor="middle" fill="#1E40AF" font-weight="500">Upload Document</text>
  <text x="360" y="231" text-anchor="middle" fill="#3B82F6" font-size="11">Seller Portal</text>

  <!-- ↓ -->
  <line x1="360" y1="239" x2="360" y2="263" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- DIAMOND: File Valid? cy=291  half-w=80 half-h=28 -->
  <polygon points="360,263 440,291 360,319 280,291" fill="#FEFCE8" stroke="#D97706" stroke-width="1.5"/>
  <text x="360" y="295" text-anchor="middle" fill="#78350F" font-weight="600">File Valid?</text>

  <!-- YES ↓ label -->
  <line x1="360" y1="319" x2="360" y2="343" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="368" y="335" fill="#16A34A" font-size="11" font-weight="600">Yes</text>

  <!-- NO → error box -->
  <line x1="440" y1="291" x2="500" y2="291" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <text x="458" y="284" fill="#DC2626" font-size="11" font-weight="600">No</text>
  <rect x="502" y="271" width="168" height="40" rx="5" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="586" y="288" text-anchor="middle" fill="#991B1B" font-weight="500">File Error</text>
  <text x="586" y="303" text-anchor="middle" fill="#DC2626" font-size="11">Show error, re-upload</text>
  <!-- error ↑ back to Upload right side -->
  <path d="M 670 271 L 670 219 L 491 219" stroke="#DC2626" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr-r)"/>

  <!-- BOX: Pending Review cy=365 -->
  <rect x="230" y="345" width="260" height="40" rx="5" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="360" y="362" text-anchor="middle" fill="#5B21B6" font-weight="500">Status: Pending Review</text>
  <text x="360" y="377" text-anchor="middle" fill="#7C3AED" font-size="11">API / System</text>

  <!-- ↓ -->
  <line x1="360" y1="385" x2="360" y2="409" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- DIAMOND: All Mandatory Docs Uploaded? cy=437 -->
  <polygon points="360,411 440,437 360,463 280,437" fill="#FEFCE8" stroke="#D97706" stroke-width="1.5"/>
  <text x="360" y="431" text-anchor="middle" fill="#78350F" font-weight="600" font-size="12">All Mandatory Docs</text>
  <text x="360" y="446" text-anchor="middle" fill="#78350F" font-weight="600" font-size="12">Uploaded?</text>

  <!-- YES ↓ -->
  <line x1="360" y1="463" x2="360" y2="487" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="368" y="479" fill="#16A34A" font-size="11" font-weight="600">Yes</text>

  <!-- NO ← back to Upload left side -->
  <path d="M 280 437 L 155 437 L 155 219 L 229 219" stroke="#64748B" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="135" y="432" fill="#64748B" font-size="11" font-weight="600">No</text>

  <!-- BOX: Submit KYC Package cy=509 -->
  <rect x="230" y="489" width="260" height="40" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="360" y="506" text-anchor="middle" fill="#1E40AF" font-weight="500">Submit KYC Package</text>
  <text x="360" y="521" text-anchor="middle" fill="#3B82F6" font-size="11">Seller Portal</text>

  <!-- ↓ -->
  <line x1="360" y1="529" x2="360" y2="553" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- BOX: Admin Review Task Created cy=575 -->
  <rect x="230" y="555" width="260" height="40" rx="5" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="360" y="572" text-anchor="middle" fill="#5B21B6" font-weight="500">Admin Review Task Created</text>
  <text x="360" y="587" text-anchor="middle" fill="#7C3AED" font-size="11">API → Admin Queue</text>

  <!-- ↓ -->
  <line x1="360" y1="595" x2="360" y2="619" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- BOX: Admin Reviews Document cy=641 -->
  <rect x="230" y="621" width="260" height="40" rx="5" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5"/>
  <text x="360" y="638" text-anchor="middle" fill="#9A3412" font-weight="500">Admin Reviews Document</text>
  <text x="360" y="653" text-anchor="middle" fill="#EA580C" font-size="11">Admin Terminal — FIFO Queue</text>

  <!-- ↓ -->
  <line x1="360" y1="661" x2="360" y2="685" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- DIAMOND: Approve or Reject? cy=713 -->
  <polygon points="360,687 440,713 360,739 280,713" fill="#FEFCE8" stroke="#D97706" stroke-width="1.5"/>
  <text x="360" y="707" text-anchor="middle" fill="#78350F" font-weight="600">Approve</text>
  <text x="360" y="722" text-anchor="middle" fill="#78350F" font-weight="600">or Reject?</text>

  <!-- APPROVE ↓ -->
  <line x1="360" y1="739" x2="360" y2="763" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="368" y="755" fill="#16A34A" font-size="11" font-weight="600">Approve</text>

  <!-- REJECT ← reject box -->
  <line x1="280" y1="713" x2="212" y2="713" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <text x="225" y="706" fill="#DC2626" font-size="11" font-weight="600">Reject</text>
  <rect x="22" y="683" width="186" height="60" rx="5" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="115" y="703" text-anchor="middle" fill="#991B1B" font-weight="500" font-size="12">Enter Rejection Reason</text>
  <text x="115" y="719" text-anchor="middle" fill="#991B1B" font-weight="500" font-size="12">(required field)</text>
  <text x="115" y="735" text-anchor="middle" fill="#DC2626" font-size="11">Notify Seller — email + in-app</text>
  <!-- reject ↑ back to Upload left -->
  <path d="M 22 713 L 8 713 L 8 219 L 229 219" stroke="#DC2626" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr-r)"/>

  <!-- DIAMOND: All Docs Approved? cy=785 -->
  <polygon points="360,765 440,785 360,805 280,785" fill="#FEFCE8" stroke="#D97706" stroke-width="1.5"/>
  <text x="360" y="780" text-anchor="middle" fill="#78350F" font-weight="600" font-size="12">All Required Docs</text>
  <text x="360" y="795" text-anchor="middle" fill="#78350F" font-weight="600" font-size="12">Approved?</text>

  <!-- YES ↓ -->
  <line x1="360" y1="805" x2="360" y2="829" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="368" y="821" fill="#16A34A" font-size="11" font-weight="600">Yes</text>

  <!-- NO → back to Admin Reviews -->
  <path d="M 440 785 L 520 785 L 520 641 L 491 641" stroke="#64748B" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="480" y="778" fill="#64748B" font-size="11" font-weight="600">No</text>

  <!-- BOX: KYC Fully Approved cy=851 -->
  <rect x="220" y="831" width="280" height="40" rx="5" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
  <text x="360" y="848" text-anchor="middle" fill="#15803D" font-weight="700">KYC Fully Approved ✓</text>
  <text x="360" y="863" text-anchor="middle" fill="#16A34A" font-size="11">All mandatory documents verified</text>

  <!-- ↓ -->
  <line x1="360" y1="871" x2="360" y2="895" stroke="#16A34A" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <!-- END oval cy=917 -->
  <ellipse cx="360" cy="917" rx="150" ry="24" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
  <text x="360" y="921" text-anchor="middle" fill="#15803D" font-weight="700" font-size="13">→ Seller Agreement (MR-003)</text>

</svg>
